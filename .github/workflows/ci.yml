name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONTENT_PUBLIC_REPOSITORY: dinayuil/french-grammar-content-public
  CONTENT_PUBLIC_REF: f1fd7e479292d016858580b7c46c82bea996d6e0

jobs:
  public-tests:
    name: Public tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: Checkout public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_PUBLIC_REPOSITORY }}
          ref: ${{ env.CONTENT_PUBLIC_REF }}
          path: content-public
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run public test suite
        working-directory: app
        run: npm test

      - name: Check public inventory
        working-directory: app
        run: npm run check:public -- --public ../content-public

      - name: Build public app
        working-directory: app
        run: npm run build
