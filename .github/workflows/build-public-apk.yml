name: Build public debug APK

# APK builds are slow, so they run on main pushes and v* tags rather than on
# every branch push; workflow_dispatch is also available. Only successful
# automatic main pushes and content-updated dispatches update apk-latest;
# manual and tag builds stay as short-lived Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      content_ref:
        description: content-public commit SHA, branch, or tag
        required: false
        default: main
        type: string
  repository_dispatch:
    types: [content-updated]
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: public-apk
  cancel-in-progress: false

env:
  CONTENT_PUBLIC_REPOSITORY: dinayuil/french-grammar-content-public
  CONTENT_PUBLIC_REF: ${{ inputs.content_ref || github.event.client_payload.sha || 'main' }}
  FGE_PUBLIC_CONTENT_DIR: ../content-public

jobs:
  build-public-apk:
    name: Build public debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      app_sha: ${{ steps.build-metadata.outputs.app_sha }}
      content_sha: ${{ steps.build-metadata.outputs.content_sha }}
      version_code: ${{ steps.build-metadata.outputs.version_code }}
      version_name: ${{ steps.build-metadata.outputs.version_name }}
      apk_sha256: ${{ steps.build-metadata.outputs.apk_sha256 }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          fetch-depth: 0

      - name: Verify commit is on main
        working-directory: app
        run: |
          set -euo pipefail

          if ! git fetch origin main --no-tags; then
            echo "::error::Could not fetch origin/main to verify the APK build commit"
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Public APK builds must come from a commit reachable from origin/main; unmerged feature-branch or tag refs are rejected"
            exit 1
          fi

      - name: Validate dispatched content SHA
        if: github.event_name == 'repository_dispatch'
        env:
          CONTENT_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if ! printf '%s' "$CONTENT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Invalid content-updated payload sha"
            exit 1
          fi

      - name: Checkout public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_PUBLIC_REPOSITORY }}
          ref: ${{ env.CONTENT_PUBLIC_REF }}
          path: content-public
          persist-credentials: false

      - name: Show content ref
        run: 'echo "content-public ref: $CONTENT_PUBLIC_REF"'

      - name: Verify content commit is on main
        run: |
          set -euo pipefail

          CONTENT_DIR="content-public"
          if ! git -C "$CONTENT_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::content-public checkout is missing" >&2
            exit 1
          fi

          if [ "$(git -C "$CONTENT_DIR" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$CONTENT_DIR" fetch --unshallow --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          else
            git -C "$CONTENT_DIR" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          fi

          CONTENT_SHA="$(git -C "$CONTENT_DIR" rev-parse HEAD)"
          CONTENT_MAIN_SHA="$(git -C "$CONTENT_DIR" rev-parse refs/remotes/origin/main)"
          if ! git -C "$CONTENT_DIR" merge-base --is-ancestor "$CONTENT_SHA" "$CONTENT_MAIN_SHA"; then
            echo "::error::content-public commit $CONTENT_SHA is not reachable from origin/main; unmerged content is rejected" >&2
            exit 1
          fi
          echo "content-public commit $CONTENT_SHA is on main history"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Gradle wrapper
        working-directory: app/android
        run: bash ./gradlew --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run public test suite
        working-directory: app
        run: npm test

      - name: Check public inventory
        working-directory: app
        run: npm run check:public -- --public ../content-public

      - name: Restore public signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FGE_PUBLIC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FGE_PUBLIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FGE_PUBLIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FGE_PUBLIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required public signing secret for $name"
              exit 1
            fi
          done

          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/fge-public.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "::error::Public signing keystore secret is not valid base64"
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Restored public signing keystore is empty"
            exit 1
          fi
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build public debug APK
        working-directory: app
        env:
          FGE_PUBLIC_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          FGE_PUBLIC_KEYSTORE_PASSWORD: ${{ secrets.FGE_PUBLIC_KEYSTORE_PASSWORD }}
          FGE_PUBLIC_KEY_ALIAS: ${{ secrets.FGE_PUBLIC_KEY_ALIAS }}
          FGE_PUBLIC_KEY_PASSWORD: ${{ secrets.FGE_PUBLIC_KEY_PASSWORD }}
          FGE_REQUIRE_PUBLIC_SIGNING: "1"
          FGE_PUBLIC_VERSION_CODE: ${{ github.run_number }}
          FGE_PUBLIC_VERSION_NAME: 1.0-test.${{ github.run_number }}
        run: npm run apk

      - name: Verify public APK identity
        env:
          EXPECTED_PACKAGE: com.fge.open
          EXPECTED_VERSION_CODE: ${{ github.run_number }}
          EXPECTED_VERSION_NAME: 1.0-test.${{ github.run_number }}
          EXPECTED_CERT_SHA256: ${{ secrets.FGE_PUBLIC_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APK="app/android/app/build/outputs/apk/public/debug/app-public-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected public APK is missing or empty: $APK"
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/36.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          for tool in "$AAPT2" "$APKSIGNER"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Android build tool is missing or not executable: $tool"
              exit 1
            fi
          done

          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$EXPECTED_CERT" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::FGE_PUBLIC_CERT_SHA256 must be a 64-hex SHA-256 certificate digest"
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p")"

          if [ "$PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Public APK package is '$PACKAGE', expected '$EXPECTED_PACKAGE'"
            exit 1
          fi
          if [ "$VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::Public APK versionCode is '$VERSION_CODE', expected '$EXPECTED_VERSION_CODE'"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]; then
            echo "::error::Public APK versionName is '$VERSION_NAME', expected '$EXPECTED_VERSION_NAME'"
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          SIGNER_COUNT="$(printf '%s\n' "$CERT_OUTPUT" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:' || true)"
          if [ "$SIGNER_COUNT" -ne 1 ]; then
            echo "::error::Public APK must have exactly one signing certificate"
            exit 1
          fi
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Public APK signing certificate SHA-256 does not match FGE_PUBLIC_CERT_SHA256"
            exit 1
          fi

          echo "Verified public APK: package=$PACKAGE versionCode=$VERSION_CODE versionName=$VERSION_NAME certSha256=$ACTUAL_CERT"

      - name: Record build metadata
        id: build-metadata
        working-directory: app
        env:
          EXPECTED_VERSION_CODE: ${{ github.run_number }}
          EXPECTED_VERSION_NAME: 1.0-test.${{ github.run_number }}
        run: |
          set -euo pipefail

          APP_SHA="$(git rev-parse HEAD)"
          CONTENT_SHA="$(git -C ../content-public rev-parse HEAD)"
          APK="android/app/build/outputs/apk/public/debug/app-public-debug.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          for sha in "$APP_SHA" "$CONTENT_SHA"; do
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Invalid commit SHA in build metadata"
              exit 1
            fi
          done
          if ! printf '%s' "$APK_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Invalid APK SHA-256 in build metadata"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::Invalid public APK versionCode"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_VERSION_NAME" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'; then
            echo "::error::Invalid public APK versionName"
            exit 1
          fi

          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "content_sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$EXPECTED_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$EXPECTED_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload public debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-public-debug
          path: app/android/app/build/outputs/apk/public/debug/app-public-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove public signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fge-public.keystore"

  publish-public-release:
    name: Update rolling public test release
    needs: build-public-apk
    # Manual runs, tag builds, and unmerged/PR refs never touch the rolling
    # release. Only successful automatic builds from this repository can.
    if: |
      github.repository == 'dinayuil/french-grammar-app' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'content-updated')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built public APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-public-debug
          path: release

      - name: Verify downloaded artifact
        id: artifact
        env:
          EXPECTED_SHA256: ${{ needs.build-public-apk.outputs.apk_sha256 }}
        run: |
          set -euo pipefail

          APK_PATH="release/app-public-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Downloaded artifact does not contain the exact app-public-debug.apk"
            exit 1
          fi
          FILE_COUNT="$(find release -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "::error::Downloaded artifact must contain exactly one file"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Build metadata did not provide a valid APK SHA-256"
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Downloaded APK SHA-256 does not match the build metadata"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Update rolling apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: dinayuil/french-grammar-app
          CONTENT_PUBLIC_REPOSITORY: dinayuil/french-grammar-content-public
          APP_SHA: ${{ needs.build-public-apk.outputs.app_sha }}
          CONTENT_SHA: ${{ needs.build-public-apk.outputs.content_sha }}
          VERSION_CODE: ${{ needs.build-public-apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.build-public-apk.outputs.version_name }}
          APK_SHA256: ${{ steps.artifact.outputs.apk_sha256 }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }
          skip() {
            echo "::notice::$*"
            exit 0
          }

          if [ "${GITHUB_REPOSITORY:-}" != "$EXPECTED_REPOSITORY" ]; then
            fail "Refusing to publish from an unexpected repository."
          fi

          for name in APP_SHA CONTENT_SHA VERSION_CODE VERSION_NAME APK_SHA256 APK_PATH RUN_ID; do
            if [ -z "${!name:-}" ]; then
              fail "Missing trusted build output or run metadata: $name"
            fi
          done

          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid app commit SHA."
          [[ "$CONTENT_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid content commit SHA."
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || fail "Invalid versionCode."
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            fail "versionCode is outside the supported 1..2100000000 range."
          fi
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]] || fail "Invalid versionName."
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid APK SHA-256."
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "Invalid workflow run id."
          if [ "$APK_PATH" != "release/app-public-debug.apk" ]; then
            fail "Refusing to publish an unexpected artifact path."
          fi

          APP_MAIN_SHA="$(git ls-remote "https://github.com/${EXPECTED_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ "$APP_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Could not resolve current app main HEAD."
          if [ "$APP_SHA" != "$APP_MAIN_SHA" ]; then
            skip "Build commit $APP_SHA is not the current app main HEAD $APP_MAIN_SHA; keeping the current rolling release."
          fi

          CONTENT_MAIN_SHA="$(git ls-remote "https://github.com/${CONTENT_PUBLIC_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ "$CONTENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Could not resolve current content-public main HEAD."
          if [ "$CONTENT_SHA" != "$CONTENT_MAIN_SHA" ]; then
            skip "Build content commit $CONTENT_SHA is not the current content-public main HEAD $CONTENT_MAIN_SHA; keeping the current rolling release."
          fi

          ERR_FILE="$(mktemp)"
          RELEASE_EXISTS=0
          IS_DRAFT=false
          RELEASE_BODY=""
          if IS_DRAFT="$(gh release view apk-latest --repo "$EXPECTED_REPOSITORY" --json isDraft --jq '.isDraft' 2>"$ERR_FILE")"; then
            RELEASE_EXISTS=1
            case "$IS_DRAFT" in
              true|false) : ;;
              *) fail "Could not determine whether apk-latest is a draft." ;;
            esac
            if [ "$IS_DRAFT" = "false" ]; then
              RELEASE_BODY="$(gh release view apk-latest --repo "$EXPECTED_REPOSITORY" --json body --jq '.body')"
            fi
          else
            if ! grep -qi 'release not found' "$ERR_FILE"; then
              cat "$ERR_FILE" >&2
              fail "Could not inspect the existing apk-latest release."
            fi
          fi

          # Published release: the version marker is updated only after assets
          # and the rolling tag are safely in place. Drafts are never skipped by
          # the published marker, so a failed draft upload can be retried.
          if [ "$RELEASE_EXISTS" -eq 1 ] && [ "$IS_DRAFT" = "false" ]; then
            PUBLISHED_VERSION="$(printf '%s\n' "$RELEASE_BODY" | sed -n 's/^- versionCode: `\([0-9][0-9]*\)`$/\1/p')"
            PUBLISHED_VERSION_NAME="$(printf '%s\n' "$RELEASE_BODY" | sed -n 's/^- versionName: `\([^`]*\)`$/\1/p')"
            [[ "$PUBLISHED_VERSION" =~ ^[1-9][0-9]{0,9}$ ]] ||
              fail "Existing apk-latest release has no valid versionCode marker; refusing to overwrite it."
            if (( PUBLISHED_VERSION < 1 || PUBLISHED_VERSION > 2100000000 )); then
              fail "Existing apk-latest release versionCode is outside the supported range; refusing to overwrite it."
            fi
            if [ "$PUBLISHED_VERSION_NAME" != "1.0-test.$PUBLISHED_VERSION" ]; then
              fail "Existing apk-latest release versionName does not match its versionCode marker; refusing to overwrite it."
            fi
            if (( PUBLISHED_VERSION >= VERSION_CODE )); then
              skip "Published versionCode $PUBLISHED_VERSION is not older than $VERSION_CODE; keeping the current release."
            fi
          fi

          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$ERR_FILE" "$NOTES_FILE"' EXIT
          RUN_URL="https://github.com/${EXPECTED_REPOSITORY}/actions/runs/${RUN_ID}"
          {
            printf '%s\n' '## 公开测试版 APK'
            printf '%s\n' ''
            printf -- '- 应用提交（app）：`%s`\n' "$APP_SHA"
            printf -- '- 题库提交（content-public）：`%s`\n' "$CONTENT_SHA"
            printf -- '- versionCode: `%s`\n' "$VERSION_CODE"
            printf -- '- versionName: `%s`\n' "$VERSION_NAME"
            printf -- '- 构建运行：%s\n' "$RUN_URL"
            printf -- '- APK SHA-256：`%s`\n' "$APK_SHA256"
            printf '%s\n' ''
            printf '%s\n' '此包由成功构建自动发布，使用固定测试签名，不是应用商店正式版本。'
            printf '%s\n' '后续测试版可直接覆盖安装；首次从旧临时 debug 签名迁移时可能需要先卸载旧版，本地学习进度不会随安装包迁移。'
          } > "$NOTES_FILE"

          set_rolling_tag() {
            TAG_SHA=""
            if TAG_SHA="$(gh api "repos/${EXPECTED_REPOSITORY}/git/ref/tags/apk-latest" --jq '.object.sha' 2>"$ERR_FILE")"; then
              if [ "$TAG_SHA" != "$APP_SHA" ]; then
                gh api -X PATCH "repos/${EXPECTED_REPOSITORY}/git/refs/tags/apk-latest" \
                  -f sha="$APP_SHA" -F force=true >/dev/null
              fi
            else
              if ! grep -q 'HTTP 404' "$ERR_FILE"; then
                cat "$ERR_FILE" >&2
                fail "Could not inspect the existing apk-latest tag."
              fi
              gh api -X POST "repos/${EXPECTED_REPOSITORY}/git/refs" \
                -f ref="refs/tags/apk-latest" -f sha="$APP_SHA" >/dev/null
            fi
          }

          # A new release needs its tag before the draft can be created. Drafts
          # and new releases are not public until the final publish step.
          if [ "$RELEASE_EXISTS" -eq 0 ] || [ "$IS_DRAFT" = "true" ]; then
            set_rolling_tag
          fi

          if [ "$RELEASE_EXISTS" -eq 0 ]; then
            gh release create apk-latest \
              --repo "$EXPECTED_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "公开测试版（滚动更新）" \
              --notes "发布准备中：资产上传并通过校验后自动发布。" >/dev/null
          fi

          CHECKSUM_PATH="$(dirname "$APK_PATH")/app-public-debug.apk.sha256"
          printf '%s  %s\n' "$APK_SHA256" "app-public-debug.apk" > "$CHECKSUM_PATH"
          gh release upload apk-latest "$APK_PATH" \
            --repo "$EXPECTED_REPOSITORY" --clobber >/dev/null
          gh release upload apk-latest "$CHECKSUM_PATH" \
            --repo "$EXPECTED_REPOSITORY" --clobber >/dev/null

          ASSET_NAMES="$(gh release view apk-latest --repo "$EXPECTED_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          EXPECTED_ASSETS="$(printf '%s\n' 'app-public-debug.apk' 'app-public-debug.apk.sha256' | sort)"
          if [ "$ASSET_NAMES" != "$EXPECTED_ASSETS" ]; then
            echo "::error::apk-latest assets are not exactly the APK and checksum:"
            printf '%s\n' "$ASSET_NAMES" >&2
            exit 1
          fi

          if [ "$RELEASE_EXISTS" -eq 1 ] && [ "$IS_DRAFT" = "false" ]; then
            # Existing published release: move the rolling tag only after the
            # assets are verified, then update notes/version marker last.
            set_rolling_tag
            gh release edit apk-latest \
              --repo "$EXPECTED_REPOSITORY" \
              --title "公开测试版（滚动更新）" \
              --prerelease --latest=false \
              --notes-file "$NOTES_FILE" >/dev/null
          else
            # New or interrupted draft: publish only after assets verify.
            # gh finds drafts by their pending tag; the marker becomes visible
            # in the same atomic edit that flips draft=false.
            gh release edit apk-latest \
              --repo "$EXPECTED_REPOSITORY" \
              --draft=false \
              --title "公开测试版（滚动更新）" \
              --prerelease --latest=false \
              --notes-file "$NOTES_FILE" >/dev/null
          fi

          echo "Published apk-latest for app $APP_SHA and content $CONTENT_SHA (versionCode $VERSION_CODE)."
