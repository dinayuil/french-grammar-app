name: Deploy public app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CONTENT_PUBLIC_REPOSITORY: dinayuil/french-grammar-content-public
  CONTENT_PUBLIC_REF: 43c2ae4f371d93f3366695ece8c01718438128b4

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: Checkout public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_PUBLIC_REPOSITORY }}
          ref: ${{ env.CONTENT_PUBLIC_REF }}
          path: content-public
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run public test suite
        working-directory: app
        run: npm test

      - name: Check public inventory
        working-directory: app
        run: npm run check:public -- --public ../content-public

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build public app
        working-directory: app
        env:
          FGE_PUBLIC_CONTENT_DIR: ../content-public
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          BASE="${BASE_PATH:-/}"
          BASE="${BASE%/}/"
          npm run build -- --base="$BASE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist/public

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke-test deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::deploy-pages did not report a page URL"
            exit 1
          fi

          PAGE_URL="${PAGE_URL%/}/"
          case "$PAGE_URL" in
            http://*) PAGE_URL="https://${PAGE_URL#http://}" ;;
          esac
          ORIGIN="$(printf '%s\n' "$PAGE_URL" | sed -E 's#^(https://[^/]+).*#\1#')"

          echo "Fetching deployed page: ${PAGE_URL}"
          HTML="$(curl -fsSL --proto '=https' --max-time 30 --retry 3 --retry-delay 2 "$PAGE_URL")"

          if ! printf '%s' "$HTML" | grep -q 'id="root"'; then
            echo "::error::Deployed page at ${PAGE_URL} is missing id=\"root\""
            exit 1
          fi

          ASSET="$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js[^"]*"' | head -n 1 | sed -E 's/^src="//; s/"$//' || true)"
          if [ -z "$ASSET" ]; then
            echo "::error::Deployed page at ${PAGE_URL} has no JS asset"
            exit 1
          fi

          case "$ASSET" in
            http://*) ASSET_URL="https://${ASSET#http://}" ;;
            https://*) ASSET_URL="$ASSET" ;;
            /*) ASSET_URL="${ORIGIN}${ASSET}" ;;
            *) ASSET_URL="${PAGE_URL}${ASSET}" ;;
          esac

          echo "Fetching deployed JS asset: ${ASSET_URL}"
          ASSET_FILE="$(mktemp)"
          trap 'rm -f "$ASSET_FILE"' EXIT
          if ! ASSET_STATUS="$(curl -fsSL --proto '=https' --max-time 30 --retry 3 --retry-delay 2 -o "$ASSET_FILE" -w '%{http_code}' "$ASSET_URL")"; then
            echo "::error::Failed to fetch deployed JS asset at ${ASSET_URL}"
            exit 1
          fi
          if [ "$ASSET_STATUS" != "200" ]; then
            echo "::error::Deployed JS asset at ${ASSET_URL} returned HTTP ${ASSET_STATUS}"
            exit 1
          fi
          if [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Deployed JS asset at ${ASSET_URL} is empty"
            exit 1
          fi
